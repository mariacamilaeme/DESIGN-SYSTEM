<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120" fill="none" class="ob-ilustracion" data-ilustracion="archivo-por-subir" aria-hidden="true" focusable="false"><style>.ob-ilustracion{overflow:visible}.ob-ilustracion .ob-il-sup{fill:var(--sup-2,rgba(128,136,152,.08));stroke:var(--linea-hover,rgba(128,136,152,.42));stroke-width:1}.ob-ilustracion .ob-il-frente{fill:var(--sup-1,rgba(128,136,152,.06));stroke:none}.ob-ilustracion .ob-il-hueco{fill:none;stroke:var(--linea-hover,rgba(128,136,152,.5));stroke-width:1.25;stroke-dasharray:4 4;stroke-linecap:round}.ob-ilustracion .ob-il-hueco-acento{fill:var(--acento-tenue,rgba(76,141,255,.08));stroke:var(--acento,#4c8dff);stroke-width:1.25;stroke-dasharray:4 4;stroke-linecap:round}.ob-ilustracion .ob-il-linea{fill:none;stroke:var(--texto-3,#7a8294);stroke-opacity:.62;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ob-ilustracion .ob-il-fina{fill:none;stroke:var(--linea-fuerte,rgba(128,136,152,.34));stroke-width:1;stroke-linecap:round}.ob-ilustracion .ob-il-acento{fill:none;stroke:var(--acento,#4c8dff);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ob-ilustracion .ob-il-acento-suave{fill:var(--acento-suave,rgba(76,141,255,.14));stroke:none}.ob-ilustracion .ob-il-punto-acento{fill:var(--acento,#4c8dff);stroke:none}.ob-ilustracion .ob-il-rojo{fill:none;stroke:var(--rojo,#ff6b6b);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.ob-ilustracion .ob-il-punto-rojo{fill:var(--rojo,#ff6b6b);stroke:none}.ob-ilustracion .ob-il-mapa{fill:var(--punto-mapa,rgba(128,136,152,.18));stroke:none}.ob-ilustracion .ob-il-t{stroke-dasharray:1;animation:ob-il-trazar 760ms cubic-bezier(0.16, 1, 0.3, 1) var(--d,0ms) both}.ob-ilustracion .ob-il-a{animation:ob-il-aparecer 560ms cubic-bezier(0.16, 1, 0.3, 1) var(--d,0ms) both}@keyframes ob-il-trazar{from{stroke-dashoffset:1;opacity:0}12%{opacity:1}to{stroke-dashoffset:0;opacity:1}}@keyframes ob-il-aparecer{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion:reduce){.ob-ilustracion .ob-il-t,.ob-ilustracion .ob-il-a{animation:none}}</style><rect style="--d:0ms" x="22" y="56" width="116" height="46" rx="12" class="ob-il-a ob-il-hueco"/><path style="--d:100ms" d="M68 14h18l12 12v34a6 6 0 0 1-6 6H68a6 6 0 0 1-6-6V20a6 6 0 0 1 6-6Z" class="ob-il-a ob-il-sup"/><path d="M86 14v12h12" pathLength="1" class="ob-il-t ob-il-fina" style="--d:220ms"/><path d="M70 36h16" pathLength="1" class="ob-il-t ob-il-linea" style="--d:260ms"/><path d="M70 44h11" pathLength="1" class="ob-il-t ob-il-linea" style="--d:300ms"/><path d="M80 94V78M73 85l7-7 7 7" pathLength="1" class="ob-il-t ob-il-acento" style="--d:460ms"/></svg>
